services:
  invoice-tool:
    build:
      context: .
      args:
        APP_VERSION: "${APP_VERSION:-0.0.0}"
    image: invoice-tool:latest
    container_name: invoice-tool
    restart: unless-stopped
    ports:
      - "8088:8000"
    environment:
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY in .env}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}"
      SHARED_PHOTOS_DIR: "/app/shared-photos"
      GOOGLE_MAPS_BROWSER_API_KEY: "${GOOGLE_MAPS_BROWSER_API_KEY:-}"
      GOOGLE_GEOCODING_API_KEY: "${GOOGLE_GEOCODING_API_KEY:-}"
      REQUIRE_DATA_DIRECTORY_IDENTITY: "1"
      DATA_DIRECTORY_IDENTITY: "invoice-tool-primary-volume1-20260816"
    extra_hosts:
      # 报销附件智能解读需要访问宿主机上的本地大模型（如 Ollama :11434），
      # 系统设置里的接口地址填 http://host.docker.internal:11434/v1
      - "host.docker.internal:host-gateway"
    volumes:
      - "${DATA_HOST_DIR:-/srv/invoice-tool/data}:/app/data"
      - "${SHARED_PHOTOS_HOST_DIR:-/srv/invoice-tool/shared-photos}:/app/shared-photos"
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: invoice-tool-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}"
    depends_on:
      - invoice-tool

  photo-worker:
    build:
      context: .
      args:
        APP_VERSION: "${APP_VERSION:-0.0.0}"
    image: invoice-tool:latest
    container_name: invoice-tool-photo-worker
    restart: unless-stopped
    command: python photo_worker.py
    mem_limit: 768m
    environment:
      SHARED_PHOTOS_DIR: "/app/shared-photos"
      PHOTO_WORKER_INTERVAL_SECONDS: "60"
      PHOTO_WORKER_STABLE_SECONDS: "120"
      PHOTO_WORKER_BATCH_SIZE: "10"
      PHOTO_BACKUP_DAYS: "7"
    volumes:
      - "${SHARED_PHOTOS_HOST_DIR:-/srv/invoice-tool/shared-photos}:/app/shared-photos"

  ai-interpret-worker:
    image: invoice-tool:latest
    container_name: invoice-tool-ai-interpret
    restart: unless-stopped
    command: python ai_interpret_worker.py
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATA_DIR: "/app/data"
      AI_INTERPRET_RUN_HOUR: "2"
      AI_INTERPRET_BATCH_LIMIT: "200"
      AI_INTERPRET_BASE_URL: "${AI_INTERPRET_BASE_URL:-}"
    volumes:
      - "${DATA_HOST_DIR:-/srv/invoice-tool/data}:/app/data"

  ai-review-worker:
    image: invoice-tool:latest
    container_name: invoice-tool-ai-review
    restart: unless-stopped
    command: python ai_review_worker.py
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATA_DIR: "/app/data"
      AI_REVIEW_BATCH_LIMIT: "100"
      AI_REVIEW_RUN_TIME: "${AI_REVIEW_RUN_TIME:-}"
    volumes:
      - "${DATA_HOST_DIR:-/srv/invoice-tool/data}:/app/data"
