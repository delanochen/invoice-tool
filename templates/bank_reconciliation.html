{% extends "base.html" %}{% block title %}银行对账{% endblock %}{% block content %}<div class="erp-app erp-scope erp-compact"><div class="erp-page-head"><div><h1>银行对账</h1><p>将实际支出流水与“已付款”付款单一对一匹配。</p></div></div><form method="post" class="erp-panel form-stack"><div class="form-grid two-columns"><label>未匹配支出流水<select name="transaction_id" required>{% for row in transactions %}<option value="{{ row.id }}">{{ row.transaction_date }} · {{ row.account_name }} · {{ row.amount|money }} · {{ row.description }}</option>{% endfor %}</select></label><label>已付款付款单<select name="payment_id" required>{% for row in payments %}<option value="{{ row.id }}">{{ row.payment_number }} · {{ row.employee_name }} · {{ row.net_amount|money }}</option>{% endfor %}</select></label></div><div class="form-actions"><button class="primary">确认匹配并完成对账</button></div></form></div>{% endblock %}
