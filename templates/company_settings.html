{% extends "base.html" %}
{% block title %}系统设置 - 发票工具{% endblock %}
{% block content %}
  <header class="page-header"><div><p class="eyebrow">Settings</p><h1>系统设置</h1></div></header>
  <form method="post" class="panel settings-layout">
    <section class="form-stack">
      <h2>收款信息</h2>
      <label>付款方式 <input name="payment_method" value="{{ payment.method }}"></label>
      <label>收款人 <input name="payment_beneficiary" value="{{ payment.beneficiary }}"></label>
      <label>银行 <input name="payment_bank_name" value="{{ payment.bank_name }}"></label>
      <label>Account Number <input name="payment_account_number" value="{{ payment.account_number }}"></label>
      <label>Routing Number <input name="payment_routing_number" value="{{ payment.routing_number }}"></label>
      <label>SWIFT/BIC <input name="payment_swift_bic" value="{{ payment.swift_bic }}"></label>
      <label>条款 <textarea name="invoice_terms" rows="6">{{ terms }}</textarea></label>
      <label>税务说明 <textarea name="company_tax_note" rows="6">{{ company.tax_note }}</textarea></label>
    </section>
    <section class="form-stack smtp-settings">
      <h2>邮件发送设置</h2>
      <label>SMTP Host <input name="smtp_host" value="{{ smtp.host }}"></label>
      <label>SMTP Port <input name="smtp_port" value="{{ smtp.port }}"></label>
      <label>SMTP User <input name="smtp_user" value="{{ smtp.user }}"></label>
      <label>SMTP Password <input type="password" name="smtp_password" value="{{ smtp.password }}"></label>
      <label>SMTP From <input name="smtp_from" value="{{ smtp['from'] }}"></label>
      <label>TLS
        <select name="smtp_tls">
          <option value="true" {% if smtp.tls == "true" %}selected{% endif %}>true</option>
          <option value="false" {% if smtp.tls == "false" %}selected{% endif %}>false</option>
        </select>
      </label>
    </section>
    <section class="form-stack full-span">
      <h2>站点地图设置</h2>
      <label>Google Maps API Key
        <input type="password" name="google_maps_browser_api_key" value="{{ google_maps_browser_api_key }}" autocomplete="off" placeholder="留空则使用免费地图">
      </label>
      <label>Google Geocoding API Key
        <input type="password" name="google_geocoding_api_key" value="{{ google_geocoding_api_key }}" autocomplete="off" placeholder="用于后端保存站点经纬度">
      </label>
      <label>预警到期（天）
        <input type="number" name="inspection_warning_days" min="1" step="1" value="{{ inspection_warning_days }}">
      </label>
      <label>巡检周期（天）
        <input type="number" name="inspection_cycle_days" min="1" step="1" value="{{ inspection_cycle_days }}">
      </label>
    </section>
    <section class="form-stack full-span">
      <h2>DeepSeek 智能助手</h2>
      <p class="muted-line">第一阶段仅允许读取当前登录用户有权限查看的数据，不执行新增、修改、删除或任意 SQL。</p>
      <label>启用智能助手
        <select name="deepseek_enabled">
          <option value="false" {% if not deepseek_enabled %}selected{% endif %}>停用</option>
          <option value="true" {% if deepseek_enabled %}selected{% endif %}>启用</option>
        </select>
      </label>
      <label>模型
        <select name="deepseek_model">
          <option value="deepseek-v4-flash" {% if deepseek_model == 'deepseek-v4-flash' %}selected{% endif %}>DeepSeek V4 Flash（日常查询）</option>
          <option value="deepseek-v4-pro" {% if deepseek_model == 'deepseek-v4-pro' %}selected{% endif %}>DeepSeek V4 Pro（复杂分析）</option>
        </select>
      </label>
      <label>API Key
        <input type="password" name="deepseek_api_key" value="" autocomplete="new-password" placeholder="{{ '已配置；留空保持不变' if deepseek_api_key_configured else '请输入 DeepSeek API Key' }}">
      </label>
      <small>API Key 仅保存在服务器设置中，不会发送到浏览器；更换 Key 后请先保存，再测试连接。</small>
      <div class="form-actions">
        <button type="button" id="testDeepSeekConnection">测试 DeepSeek 连接</button>
        <span id="deepSeekConnectionResult" class="muted-line" aria-live="polite"></span>
      </div>
    </section>
    <div class="full-span form-actions"><button class="primary" type="submit">保存系统设置</button></div>
  </form>
{% endblock %}
{% block scripts %}
  <script>
    (() => {
      const button = document.getElementById("testDeepSeekConnection");
      const result = document.getElementById("deepSeekConnectionResult");
      button?.addEventListener("click", async () => {
        button.disabled = true;
        result.textContent = "正在测试...";
        try {
          const response = await fetch({{ url_for('deepseek_connection_test')|tojson }}, {method: "POST"});
          const data = await response.json().catch(() => ({}));
          if (!response.ok || !data.ok) throw new Error(data.error || `测试失败（${response.status}）`);
          result.textContent = `${data.model}：${data.message}`;
        } catch (error) {
          result.textContent = error.message || "测试失败。";
        } finally {
          button.disabled = false;
        }
      });
    })();
  </script>
{% endblock %}
