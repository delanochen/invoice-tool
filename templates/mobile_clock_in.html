<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f766e">
    <title>团队打卡</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='mobile-clock-in.css', v=app_version) }}">
  </head>
  <body>
    <main class="clock-shell" data-operator="{{ operator_name }}" data-upload-url="{{ url_for('upload_mobile_clock_in') }}">
      <header class="clock-header">
        <div><span class="eyebrow">PRASINOS POWER</span><h1>团队打卡</h1></div>
        <a href="{{ url_for('dashboard') }}">进入系统</a>
      </header>

      <section class="clock-card">
        <label>站点
          <select id="clockSite" required>
            <option value="">请选择站点</option>
            {% for site in sites %}
              <option value="{{ site.id }}" data-name="{{ site.name }}">{{ site.name }}{% if site.detailed_address %} · {{ site.detailed_address }}{% endif %}</option>
            {% endfor %}
          </select>
        </label>

        <div class="clock-time-panel">
          <span>水印时间</span><strong id="clockTime"></strong>
          <div class="clock-adjustments">
            <button type="button" data-adjust="-5">−5 分钟</button>
            <button type="button" data-adjust="-1">−1 分钟</button>
            <button type="button" id="clockReset">当前</button>
            <button type="button" data-adjust="1">+1 分钟</button>
            <button type="button" data-adjust="5">+5 分钟</button>
          </div>
          <small id="clockOffset">未调整</small>
        </div>

        <div class="clock-location">
          <div><span>定位</span><strong id="locationText">正在获取坐标…</strong></div>
          <button type="button" id="refreshLocation">重新定位</button>
        </div>

        <label class="camera-button disabled" id="cameraButton">
          <span>拍照并自动上传</span>
          <input id="clockCamera" type="file" accept="image/*" capture="environment" disabled>
        </label>
        <p class="clock-hint">照片会写入站点、操作员、所选时间和 GPS 坐标水印，然后自动上传 NAS。</p>
        <div id="clockStatus" class="clock-status" role="status" aria-live="polite"></div>
        <canvas id="clockPreview" hidden></canvas>
      </section>

      {% if recent %}
      <section class="recent-card">
        <h2>最近打卡</h2>
        {% for item in recent %}
          <div><strong>{{ item.site_name }}</strong><span>{{ item.captured_at[:19].replace('T', ' ') }}</span></div>
        {% endfor %}
      </section>
      {% endif %}
    </main>
    <script src="{{ url_for('static', filename='mobile-clock-in.js', v=app_version) }}"></script>
  </body>
</html>
