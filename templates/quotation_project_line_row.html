<tr>
  <td class="line-no"></td>
  <td>
    <input type="search" class="section-filter" placeholder="搜索报价项目" aria-label="搜索报价项目">
    <select name="project_line_project_id" class="section-select">
      <option value="">选择报价项目</option>
      {% if line.section_name and not line.project_id %}
        <option value="legacy" selected data-legacy="1">{{ line.section_name }}（历史文本）</option>
      {% endif %}
      {% for item in quotation_projects %}
        <option value="{{ item.id }}" data-name="{{ item.name }}" data-price="{{ item.unit_price or 0 }}" {% if line.project_id|string == item.id|string %}selected{% endif %}>{{ item.name }}</option>
      {% endfor %}
      {% if line.project_id and line.project_id|string not in quotation_projects|map(attribute='id')|map('string')|list %}
        <option value="{{ line.project_id }}" selected>{{ line.section_name }}</option>
      {% endif %}
    </select>
    <input type="hidden" name="project_section" class="section-name" value="{{ line.section_name or '' }}">
  </td>
  <td>
    <textarea name="project_scope" rows="2">{{ line.scope_of_work or '' }}</textarea>
    <input name="project_scope_zh" value="{{ line.scope_of_work_zh or '' }}" placeholder="中文工作范围（可选）">
    <input name="project_scope_en" value="{{ line.scope_of_work_en or '' }}" placeholder="English scope (optional)">
  </td>
  <td><input type="number" step="any" min="0" name="project_qty" class="qty" value="{{ line.qty if line.qty is not none else '' }}"></td>
  <td>
    <select name="project_unit" class="unit-select">
      <option value="" {% if not line.unit %}selected{% endif %}></option>
      {% for unit in project_units %}
        <option value="{{ unit }}" {% if line.unit == unit %}selected{% endif %}>{{ unit }}</option>
      {% endfor %}
      <option value="{{ custom_unit }}" {% if line.unit == custom_unit %}selected{% endif %}>自定义</option>
    </select>
    <input name="project_unit_custom" class="unit-custom" value="{{ line.unit_custom or '' }}" placeholder="自定义单位" {% if line.unit != custom_unit %}hidden{% endif %}>
  </td>
  <td><input type="number" step="any" min="0" name="project_unit_price" class="price" value="{{ line.unit_price if line.unit_price is not none else '' }}"></td>
  <td><input type="number" step="0.01" min="0" name="project_line_total" class="line-total" value="{{ line.line_total if line.line_total is not none else '' }}"></td>
  <td>
    <textarea name="project_notes" rows="2">{{ line.notes or '' }}</textarea>
    <input name="project_notes_zh" value="{{ line.notes_zh or '' }}" placeholder="中文备注（可选）">
    <input name="project_notes_en" value="{{ line.notes_en or '' }}" placeholder="English note (optional)">
  </td>
  <td class="project-line-actions">
    <button type="button" class="erp-btn move-up">上移</button>
    <button type="button" class="erp-btn move-down">下移</button>
    <button type="button" class="erp-btn danger remove-line">删除</button>
  </td>
</tr>
