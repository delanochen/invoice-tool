<tr>
  <td class="line-no"></td>
  <td><input name="project_section" value="{{ line.section_name or '' }}"></td>
  <td><textarea name="project_scope" rows="2">{{ line.scope_of_work or '' }}</textarea></td>
  <td><input type="number" step="any" min="0" name="project_qty" class="qty" value="{{ line.qty if line.qty is not none else '' }}"></td>
  <td>
    <select name="project_unit" class="unit-select">
      <option value="" {% if not line.unit %}selected{% endif %}></option>
      {% for unit in project_units %}
        <option value="{{ unit }}" {% if line.unit == unit %}selected{% endif %}>{{ unit }}</option>
      {% endfor %}
      <option value="{{ custom_unit }}" {% if line.unit == custom_unit %}selected{% endif %}>自定义</option>
    </select>
    <input name="project_unit_custom" class="unit-custom" value="{{ line.unit_custom or '' }}" placeholder="自定义单位" {% if line.unit != custom_unit %}hidden{% endif %}>
  </td>
  <td><input type="number" step="any" min="0" name="project_unit_price" class="price" value="{{ line.unit_price if line.unit_price is not none else '' }}"></td>
  <td><input type="number" step="0.01" min="0" name="project_line_total" class="line-total" value="{{ line.line_total if line.line_total is not none else '' }}"></td>
  <td><textarea name="project_notes" rows="2">{{ line.notes or '' }}</textarea></td>
  <td class="project-line-actions">
    <button type="button" class="erp-btn move-up">上移</button>
    <button type="button" class="erp-btn move-down">下移</button>
    <button type="button" class="erp-btn danger remove-line">删除</button>
  </td>
</tr>
