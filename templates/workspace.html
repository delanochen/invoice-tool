{% extends "base.html" %}
{% block title %}工作区 - 发票工具{% endblock %}
{% block body_class %}workspace-shell{% endblock %}
{% block content %}
<section id="workspace" aria-label="工作区">
  <div class="workspace-toolbar no-print">
    <div id="workspaceTabs" role="tablist" aria-label="已打开页面"></div>
    <button type="button" id="workspaceRefresh" title="刷新当前页面" aria-label="刷新当前页面"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M20 7v5h-5M20 12a8 8 0 1 0-2 5M20 12a8 8 0 0 0-2-5"/></svg><span>刷新</span></button>
    <button type="button" id="workspaceCloseOthers" title="关闭其他标签" aria-label="关闭其他标签"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="7" width="14" height="13" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v11M7 11l6 5M13 11l-6 5"/></svg><span>关闭其他</span></button>
  </div>
  <div id="workspaceNotice" class="workspace-notice no-print" hidden>其他页面已执行操作，本页数据可能已更新。<button type="button" id="workspaceNoticeRefresh">刷新本页</button><span>刷新前请先处理未保存内容。</span></div>
  <div id="workspacePages"></div>
</section>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='workspace.js', v=app_version) }}"></script>{% endblock %}
